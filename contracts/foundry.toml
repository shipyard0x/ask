[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 2000
evm_version = "paris"
gas_limit = "18446744073709551615"

# Sandbox profile: uses a local solc-js shim (no network). Run with
#   FOUNDRY_PROFILE=sandbox forge test
[profile.sandbox]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "/sessions/cool-vigilant-edison/tools/solc"
optimizer = true
optimizer_runs = 2000
evm_version = "paris"
gas_limit = "18446744073709551615"

[fuzz]
runs = 128

[invariant]
runs = 48
depth = 24
fail_on_revert = false

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
